appId: com.fromanium.erebus
productName: Erebus
copyright: Copyright © 2026 Erebus contributors
electronDist: ../../node_modules/electron/dist
electronVersion: 42.8.1
asar: true
asarUnpack:
  - "**/lib/backend/native/**"
  - "**/lib/backend/shell-integrations/**"
  - "**/lib/prebuilds/**"
nodeGypRebuild: false
npmRebuild: false

directories:
  buildResources: resources

# node_modules and package.json are copied automatically
# Exclude node_modules manually because electron is copied by electron-builder and we are using a bundled backend
files:
  - src-gen
  - lib
  - resources/icons/Erebus.png
  - resources/ErebusSplash.svg
  - scripts
  - "!**node_modules/**"
extraResources:
  - from: ../../plugins
    to: app/plugins

win:
  icon: resources/icons/Erebus.ico
  target:
    - nsis
  publish:
    provider: generic
    url: "https://download.eclipse.org/theia/ide/${version}/windows"
    useMultipleRangeRequest: false
mac:
  icon: resources/icons/MacLauncherIcons/icon.icns
  category: public.app-category.developer-tools
  protocols:
    - name: erebus
      schemes:
        - erebus
  darkModeSupport: true
  target:
    - dmg
    - zip
  publish:
    provider: generic
    url: "https://download.eclipse.org/theia/ide/latest/macos"
linux:
  icon: resources/icons/LinuxLauncherIcons
  category: Development
  mimeTypes:
    - inode/directory
  vendor: Eclipse Foundation, Inc
  target:
    - deb
    - AppImage
  publish:
    provider: generic
    url: "https://download.eclipse.org/theia/ide/latest/linux"

nsis:
  menuCategory: true
  oneClick: false
  perMachine: false
  installerHeaderIcon: resources/icons/Erebus.ico
  installerIcon: resources/icons/Erebus.ico
  uninstallerIcon: resources/icons/Erebus.ico
  installerSidebar: resources/icons/InstallerSidebarImage/164-314Windows.bmp
  uninstallerSidebar: resources/icons/InstallerSidebarImage/164-314Windows.bmp
  allowToChangeInstallationDirectory: true
  runAfterFinish: false
  artifactName: ${productName}Setup.${ext}
  license: LICENSE
dmg:
  artifactName: ${productName}.${ext}
deb:
  artifactName: ${productName}.${ext}
appImage:
  artifactName: ${productName}.${ext}

afterPack: ./scripts/after-pack.js
