<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        html,
        body {
            background-color: black;
        }

        .theia-preload {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            /* Above styles copied from https://github.com/eclipse-theia/theia/blob/5aeef6c0c683b4e91713ab736957e6655b486adc/packages/core/src/browser/style/index.css#L147-L151 */
            /* Otherwise, there is a flickering when Theia's CSS loads. */

            background-image: none;
        }

        .theia-preload::after {
            /* remove default loading animation */
            content: none;
        }

        .spinner-container {
            display: flex;
            flex-direction: center;
            align-self: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }

        .custom-spinner {
            align-self: center;
        }

        .custom-spinner img {
            display: block;
            width: clamp(96px, 12vmin, 180px);
            height: auto;
            animation-duration: 2s;
            animation-iteration-count: infinite;
            animation-name: erebus-spinner;
            animation-timing-function: ease-in-out;
        }

        @keyframes erebus-spinner {
            0% {
                opacity: 1;
                transform: scale(1.0);
            }

            50% {
                opacity: 0.72;
                transform: scale(0.9);
            }

            100% {
                opacity: 1;
                transform: scale(1.0);
            }
        }
    </style>
</head>

<body>
    <div class='spinner-container'>
        <div class='custom-spinner'>
            <img src="../../resources/icons/Erebus.png" alt="Erebus" draggable="false">
        </div>
    </div>
</body>

</html>
